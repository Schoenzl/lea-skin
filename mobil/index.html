<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Einsatz">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Einsatzmonitor</title>
<style>
@font-face { font-family: B; font-weight: 400; src: url(/fonts/barlow-latin-400-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: B; font-weight: 500; src: url(/fonts/barlow-latin-500-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: B; font-weight: 600; src: url(/fonts/barlow-latin-600-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: B; font-weight: 700; src: url(/fonts/barlow-latin-700-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: BC; font-weight: 600; src: url(/fonts/barlow-condensed-latin-600-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: BC; font-weight: 700; src: url(/fonts/barlow-condensed-latin-700-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: BC; font-weight: 800; src: url(/fonts/barlow-condensed-latin-800-normal.woff2) format('woff2'); font-display: swap; }
:root { --bg: #0B0E13; --karte: #161B23; --tief: #0F1319; --linie: #222935; --text: #F2F4F7; --grau: #A9B1BC; --grau2: #6B7684;
  --gruen: #22C55E; --gelb: #FACC15; --orange: #FB923C; --rot: #EF4444; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: B, -apple-system, BlinkMacSystemFont, sans-serif; }
body { padding-bottom: calc(70px + env(safe-area-inset-bottom)); min-height: 100vh; }
.cond { font-family: BC, 'Arial Narrow', sans-serif; }
#app { max-width: 560px; margin: 0 auto; }
.kopf { padding: calc(env(safe-area-inset-top) + 10px) 16px 14px; }
main { padding: 12px; display: grid; gap: 12px; }
.card { background: var(--karte); border-radius: 14px; padding: 14px; }
.lab { font-size: 12px; font-weight: 600; letter-spacing: 2px; color: var(--grau); text-transform: uppercase; margin-bottom: 8px; }
.leer { color: var(--grau); font-size: 14px; }
.hinweis { margin: 12px 12px 0; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; background: #3B2A0A; color: #FCD34D; }
.hinweis.rot { background: #3A1010; color: #FCA5A5; }

/* Alarmband */
.band .z1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.stufe { font-family: BC; font-weight: 800; font-size: 46px; line-height: 1; }
.art { font-family: BC; font-weight: 700; font-size: 26px; line-height: 1.1; }
.band .z2 { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 15px; opacity: .95; gap: 8px; }
.timer { font-family: BC; font-weight: 700; font-size: 22px; background: rgba(0,0,0,.25); padding: 2px 10px; border-radius: 6px; }
.band.hell { color: #111827; } .band.hell .timer { background: rgba(0,0,0,.12); }
.mehr { display: flex; gap: 6px; margin-top: 10px; }
.mehr button { font: inherit; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.5); background: transparent; color: inherit; }
.mehr button.an { background: rgba(255,255,255,.9); color: #111827; }

.strasse { font-family: BC; font-weight: 700; font-size: 30px; line-height: 1.05; }
.stadt { font-size: 16px; color: #C8CFD8; margin-top: 2px; }
.zusatz { margin-top: 8px; font-size: 14px; color: var(--gelb); }
.karte { position: relative; height: 200px; border-radius: 10px; margin-top: 12px; overflow: hidden; background: #E9E5DC; }
.karte img { position: absolute; width: 256px; height: 256px; }
.karte .pin { position: absolute; left: 50%; top: 50%; width: 30px; height: 40px; transform: translate(-50%, -100%); }
.karte .nav { position: absolute; right: 8px; bottom: 8px; background: #fff; color: #111; font-weight: 700; font-size: 14px; padding: 8px 12px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.35); text-decoration: none; }
.karte .keine { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; }
.mb { font-size: 15px; color: #DDE2E8; line-height: 1.4; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #2A3340; }
.chip.warn { background: #F97316; color: #fff; } .chip.stop { background: #DC2626; color: #fff; }

.ampel { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ampel .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
.ampel b { font-family: BC; font-size: 26px; font-weight: 700; }
.ampel span { color: var(--grau); font-size: 14px; }
.zahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 8px; margin-top: 12px; }
.zahl { background: var(--tief); border-radius: 10px; padding: 8px 4px; text-align: center; }
.zahl .n { font-family: BC; font-weight: 800; font-size: 30px; line-height: 1; }
.zahl .t { font-size: 11px; color: var(--grau); margin-top: 2px; }
.p { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--linie); }
.p:first-child { border-top: 0; }
.p .r { width: 24px; flex: none; color: var(--grau2); font-family: BC; font-weight: 700; font-size: 18px; }
.p .nm { font-weight: 600; font-size: 16px; flex: 1; min-width: 0; }
.p .nm small { display: block; color: var(--grau); font-weight: 500; font-size: 12px; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.f { font-family: BC; font-weight: 700; font-size: 13px; padding: 2px 6px; border-radius: 4px; }
.p.nein { opacity: .45; } .p.nein .nm { text-decoration: line-through; }
.offen { color: var(--grau); font-size: 13px; padding-top: 10px; border-top: 1px solid var(--linie); margin-top: 4px; }

/* Lage */
.uhr { font-family: BC; font-weight: 700; font-size: 58px; line-height: 1; }
.dat { color: var(--grau); font-size: 15px; margin-top: 2px; }
.wet { display: flex; gap: 12px; align-items: center; margin-top: 10px; font-size: 15px; color: #DDE2E8; }
.wet b { font-family: BC; font-size: 32px; color: var(--text); }
.ruhig { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
.ruhig .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--gruen); }
.zeile { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--linie); font-size: 15px; align-items: baseline; }
.zeile:first-of-type, .lab + .zeile { border-top: 0; }
.zeile .d { width: 84px; flex: none; color: var(--grau); font-size: 13px; }
.zeile .w { flex: 1; min-width: 0; }
.zeile .w small { display: block; color: var(--grau); font-size: 13px; }
.cd { font-family: BC; font-weight: 700; font-size: 13px; padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
.eigen { color: #FDBA74; font-weight: 700; }
.knopf { display: block; text-align: center; font: inherit; font-weight: 700; font-size: 15px; padding: 12px; border-radius: 10px; border: 0; background: #B3122E; color: #fff; text-decoration: none; width: 100%; }
.knopf.grau { background: #2A3340; }
.da-wahl { display: grid; gap: 8px; margin-top: 10px; }
.da-wahl button { text-align: left; font: inherit; font-size: 15px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--linie); background: var(--tief); color: var(--text); }
.da-wahl button small { display: block; color: var(--grau); font-size: 12px; margin-top: 2px; }
.da-wahl select { font: inherit; padding: 11px; border-radius: 10px; border: 1px solid var(--linie); background: var(--tief); color: var(--text); }
.da-ok { color: #4ADE80; font-weight: 700; margin-top: 10px; }
.da-fehler { color: #FCA5A5; font-weight: 600; margin-top: 10px; }

/* Fahrzeuge */
.fzk .k { display: flex; align-items: baseline; gap: 10px; }
.fzk .k b { font-family: BC; font-size: 26px; font-weight: 800; }
.fzk .st { font-weight: 700; font-size: 15px; }
.fzk .det { color: #DDE2E8; font-size: 14px; margin-top: 6px; }
.fzk .pk { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #2A3340; color: var(--grau); }
.pk-bald { background: #3B2A0A !important; color: #FCD34D !important; } .pk-rot { background: #3A1010 !important; color: #FCA5A5 !important; }
.fahrten { margin-top: 10px; }
.g { color: #4ADE80; } .y { color: var(--gelb); } .o { color: var(--orange); } .r { color: #F87171; }

.fuss { text-align: center; font-size: 12px; color: var(--grau2); padding: 4px 12px 12px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr); background: #11151C; border-top: 1px solid var(--linie);
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); text-align: center; z-index: 5; }
.tabbar button { font: inherit; font-size: 12px; color: #8A94A3; background: none; border: 0; padding: 4px 0; position: relative; }
.tabbar button.an { color: #fff; font-weight: 700; }
.tabbar svg { display: block; margin: 0 auto 2px; width: 24px; height: 24px; }
.tabbar .punkt { position: absolute; top: 2px; left: calc(50% + 8px); width: 10px; height: 10px; border-radius: 50%; background: var(--rot); box-shadow: 0 0 8px var(--rot); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"><div class="kopf"><div class="leer">wird geladen …</div></div></div>
<nav class="tabbar">
  <button type="button" data-tab="einsatz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18v-6a5 5 0 0 1 10 0v6"/><path d="M5 21h14v-3H5z"/><path d="M12 2v2M4.2 5.2l1.4 1.4M19.8 5.2l-1.4 1.4"/></svg>Einsatz<span class="punkt" hidden></span></button>
  <button type="button" data-tab="lage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/></svg>Lage</button>
  <button type="button" data-tab="fahrzeuge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16V7h11v9"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>Fahrzeuge</button>
</nav>
<script>
(() => {
  // ---------- Hilfen ----------
  const $ = (s) => document.querySelector(s);
  const h = (tag, cls, kids, style) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (style) Object.assign(e.style, style);
    (kids || []).forEach((k) => { if (k == null || k === '' || k === false) return; e.appendChild(typeof k === 'string' || typeof k === 'number' ? document.createTextNode(String(k)) : k); });
    return e;
  };
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '').toLowerCase();
  const pad = (n) => String(n).padStart(2, '0');
  const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const hhmm = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const tagKurz = (t) => { const d = new Date(t); return WT[d.getDay()] + ' ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.'; };
  const gleicherTag = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
  const wann = (t) => (gleicherTag(t, jetzt()) ? '' : gleicherTag(t, jetzt() + 864e5) ? 'morgen ' : tagKurz(t) + ' ') + hhmm(t);
  const dauer = (ms) => { let s = Math.max(0, Math.floor(ms / 1000)); const hh = Math.floor(s / 3600); s -= hh * 3600; const m = Math.floor(s / 60); s -= m * 60; return (hh ? hh + ':' + pad(m) : pad(m)) + ':' + pad(s); };
  const istHell = (hex) => { const m = String(hex || '').replace('#', '').match(/^(..)(..)(..)$/); if (!m) return false; const [r, g, b] = m.slice(1).map((x) => parseInt(x, 16)); return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6; };

  let D = null, off = 0, empfangen = 0, letzteJson = '', tab = null, evIdx = 0, gesehen = null, fehler = '';
  const jetzt = () => Date.now() + off;
  const cfg = () => (D && D.cfg) || {};
  const ex = () => (D && D.extra) || {};
  const farbe = (t) => { const f = cfg().farben || {}; return f[String(t || '').charAt(0).toUpperCase()] || f.default || '#4B5563'; };
  const chipStil = (t) => { const c = farbe(t); return istHell(c) ? { background: c, color: '#111827' } : { background: c, color: '#fff' }; };
  const piOk = () => empfangen && jetzt() - empfangen < 30000;
  const leaOk = () => D && D.lea && D.lea.at && jetzt() - D.lea.at < 90000;
  const einsaetze = () => (piOk() && leaOk() && Array.isArray(D.lea.events) ? D.lea.events : []);

  // ---------- Einsatz-Logik (wie am Infoscreen) ----------
  const fnKeys = () => Object.keys(cfg().funktionen || {});
  const fnStil = (s) => { const k = fnKeys().find((x) => norm(x) === norm(s)); return k ? cfg().funktionen[k] : { bg: '#2A3340', fg: '#F2F4F7' }; };
  const fnOrd = (s) => { const i = fnKeys().findIndex((x) => norm(x) === norm(s)); return i < 0 ? 99 : i; };
  const hasFn = (p, k) => (p.functions || []).some((f) => norm(f.shortname) === norm(k));
  const elRank = (p) => { const i = (cfg().elListe || []).findIndex(([v, n]) => norm(v) === norm(p.firstname) && norm(n) === norm(p.lastname)); return i >= 0 ? i + 1 : null; };
  const meldebild = (ev) => {
    let t = String(ev.additionalinformation || '').trim();
    t = t.replace(/^\S+\s+\(\d{1,2}:\d{2}\)\s*/, '').replace(/\s*\(\s*-?\d+\.\d+\s*,\s*-?\d+\.\d+\s*\)\s*$/, '');
    const i = t.indexOf(': ');
    return (i >= 0 ? t.slice(i + 2).trim() : '') || t;
  };
  const ampel = (ja) => {
    const F = cfg().fahrzeug; if (!F) return null;
    const slots = []; F.rollen.forEach((r) => { for (let i = 0; i < r.anzahl; i++) slots.push(r.kuerzel); });
    const n = slots.length, voll = Math.pow(2, n + 1) - 2;
    let best = [], bestS = -1; const used = new Set(), cur = [];
    const score = (a) => a.reduce((s, v, i) => s + (v != null ? Math.pow(2, n - i) : 0), 0);
    const dfs = (i, minJ) => {
      if (bestS === voll) return;
      if (i === n) { const sc = score(cur); if (sc > bestS) { bestS = sc; best = cur.slice(); } return; }
      const wie = i > 0 && slots[i] === slots[i - 1];
      for (let j = wie ? minJ : 0; j < ja.length; j++) {
        if (used.has(j) || !hasFn(ja[j], slots[i])) continue;
        used.add(j); cur.push(j); dfs(i + 1, j + 1); cur.pop(); used.delete(j);
        if (bestS === voll) return;
      }
      cur.push(null); dfs(i + 1, wie ? minJ : 0); cur.pop();
    };
    dfs(0, 0);
    const rows = F.rollen.map((r) => { const ist = best.filter((v, i) => v != null && slots[i] === r.kuerzel).length; return { k: r.kuerzel, ist, soll: r.anzahl, ok: ist >= r.anzahl, pflicht: r.pflicht }; });
    const gesOk = ja.length >= (F.mindestGesamt || 0);
    let status = 'besetzbar';
    if (rows.some((r) => r.pflicht && !r.ok)) status = 'nicht besetzbar';
    else if (rows.some((r) => !r.ok) || !gesOk) status = 'knapp';
    return { rows, status, name: F.name, besatzung: F.besatzung };
  };

  // ---------- Karte ----------
  const koord = (ev) => {
    const l = ev.location || {}; const a = Number(l.x), b = Number(l.y);
    if (!isFinite(a) || !isFinite(b) || (!a && !b)) return null;
    return { lat: Math.max(a, b), lon: Math.min(a, b) };
  };
  const navLink = (k, adr) => /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)
    ? 'https://maps.apple.com/?daddr=' + k.lat + ',' + k.lon + '&dirflg=d'
    : 'https://www.google.com/maps/dir/?api=1&destination=' + k.lat + ',' + k.lon;
  const karte = (ev) => {
    const box = h('div', 'karte'); const k = koord(ev);
    if (!k) { box.appendChild(h('div', 'keine', ['Keine Koordinaten'])); return box; }
    const z = cfg().karteZoom || 16, size = 256, scale = size * Math.pow(2, z);
    const px = ((k.lon + 180) / 360) * scale;
    const r = (k.lat * Math.PI) / 180;
    const py = ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * scale;
    requestAnimationFrame(() => {
      const w = box.clientWidth || 360, ht = box.clientHeight || 200;
      for (let tx = Math.floor((px - w / 2) / size); tx <= Math.floor((px + w / 2) / size); tx++) {
        for (let ty = Math.floor((py - ht / 2) / size); ty <= Math.floor((py + ht / 2) / size); ty++) {
          const img = document.createElement('img'); img.alt = ''; img.referrerPolicy = 'no-referrer';
          img.onerror = () => { img.style.visibility = 'hidden'; };
          img.src = (cfg().karteUrl || '').replace('{z}', z).replace('{x}', tx).replace('{y}', ty);
          img.style.left = Math.round(tx * size - px + w / 2) + 'px'; img.style.top = Math.round(ty * size - py + ht / 2) + 'px';
          box.insertBefore(img, box.firstChild);
        }
      }
    });
    const pin = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    pin.setAttribute('viewBox', '0 0 30 40'); pin.setAttribute('class', 'pin');
    pin.innerHTML = '<path d="M15 39C6 27 2 21 2 14a13 13 0 0 1 26 0c0 7-4 13-13 25z" fill="#B3122E" stroke="#fff" stroke-width="2"/><circle cx="15" cy="14" r="5" fill="#fff"/>';
    box.appendChild(pin);
    const a = h('a', 'nav', ['Navigation ↗']); a.href = navLink(k); a.target = '_blank'; a.rel = 'noopener';
    box.appendChild(a);
    return box;
  };

  // ---------- Ansicht: Einsatz ----------
  const refs = {};
  const renderEinsatz = (app) => {
    const evs = einsaetze();
    if (!evs.length) { renderKeinEinsatz(app); return; }
    if (evIdx >= evs.length) evIdx = 0;
    const ev = evs[evIdx], c = farbe(ev.eventtype);
    refs.timer = h('span', 'timer cond', [dauer(jetzt() - ev.alarmtime)]); refs.alarm = ev.alarmtime;
    const gruppen = (ev.alarmedalarmgroups || []).map((g) => String(g.name || g.id).replace(/\s*-\s*Sammelruf$/i, ''))
      .filter((g) => !(cfg().eigeneFF && norm(g).indexOf(norm(cfg().eigeneFF)) !== -1));
    const band = h('div', 'kopf band' + (istHell(c) ? ' hell' : ''), [
      h('div', 'z1', [h('span', 'stufe', [ev.eventtype || '–']), h('span', 'art', [ev.eventtypetext || 'Einsatz'])]),
      h('div', 'z2', [h('span', null, ['Alarm ' + (ev.alarmtime ? hhmm(ev.alarmtime) : '–')]), refs.timer]),
      evs.length > 1 ? h('div', 'mehr', evs.map((e, i) => { const b = h('button', i === evIdx ? 'an' : '', [(i + 1) + ' · ' + (e.eventtype || '')]); b.type = 'button'; b.onclick = () => { evIdx = i; zeichnen(true); }; return b; })) : null
    ], { background: c });

    const loc = ev.location || {};
    const strasse = [loc.street, loc.housenumber].filter(Boolean).join(' ') || loc.objectname || loc.city || 'Einsatzort siehe Meldebild';
    const ort = [loc.zipcode, loc.city].filter(Boolean).join(' ');
    const zusatz = [loc.street ? loc.objectname : '', loc.additionalinfo].filter(Boolean).join(' · ');

    const uwz = (ex().uwz || []).filter((w) => w.tag === 'heute');
    const maengel = (ex().fahrzeugStatus || []).filter((x) => x.bereit && x.bereit !== 'ja');
    const warn = uwz.map((w) => h('span', 'chip warn', ['⚠ ' + w.art]))
      .concat(maengel.map((x) => h('span', 'chip ' + (x.bereit === 'nein' ? 'stop' : 'warn'), ['⚠ ' + x.fahrzeug + ' ' + (x.bereit === 'nein' ? 'nicht einsatzbereit' : 'eingeschränkt') + (x.mangel ? ': ' + x.mangel : '')])));

    const alle = ev.alarmedpersons || [];
    const ja = alle.filter((p) => p.response && p.response.basicresponse === 'Ja');
    const nein = alle.filter((p) => p.response && p.response.basicresponse && p.response.basicresponse !== 'Ja');
    const offen = alle.filter((p) => !p.response || !p.response.basicresponse);
    const gereiht = ja.map((p) => ({ p, rank: elRank(p), t: (p.response && p.response.timestamp) || 0 }))
      .sort((x, y) => (x.rank != null && y.rank != null ? x.rank - y.rank : x.rank != null ? -1 : y.rank != null ? 1 : x.t - y.t));
    const am = ampel(ja);
    const amFarbe = am ? (am.status === 'besetzbar' ? 'var(--gruen)' : am.status === 'knapp' ? 'var(--orange)' : 'var(--rot)') : null;
    const zahlen = [h('div', 'zahl', [h('div', 'n cond', [ja.length]), h('div', 't', [ja.length === 1 ? 'Zusage' : 'Zusagen'])])]
      .concat((cfg().fahrzeug && cfg().fahrzeug.rollen ? cfg().fahrzeug.rollen.map((r) => r.kuerzel) : fnKeys()).map((k) => ({ k, n: ja.filter((p) => hasFn(p, k)).length }))
        .map((x) => h('div', 'zahl', [h('div', 'n cond', [x.n]), h('div', 't', [x.k === 'C' ? 'C-Fahrer' : x.k])])));
    const tags = (p) => h('div', 'tags', (p.functions || []).slice().sort((a, b) => fnOrd(a.shortname) - fnOrd(b.shortname))
      .map((f) => { const s = fnStil(f.shortname); return h('span', 'f', [f.shortname], { background: s.bg, color: s.fg }); }));
    const name = (p) => [p.firstname, p.lastname].filter(Boolean).join(' ');
    const personen = gereiht.map((x) => h('div', 'p', [
      h('span', 'r', [x.rank != null ? String(x.rank) : '']),
      h('span', 'nm', [name(x.p), h('small', null, [(x.p.response.freetext || '') || (x.t ? 'zugesagt ' + hhmm(x.t) : '')])]),
      tags(x.p)
    ])).concat(nein.map((p) => h('div', 'p nein', [h('span', 'r'), h('span', 'nm', [name(p)]), tags(p)])));

    app.append(band, h('main', null, [
      h('div', 'card', [h('div', 'lab', ['Wohin']), h('div', 'strasse cond', [strasse]), ort ? h('div', 'stadt', [ort]) : null,
        zusatz ? h('div', 'zusatz', ['⚠ ' + zusatz]) : null, karte(ev)]),
      h('div', 'card', [h('div', 'lab', ['Was']), h('div', 'mb', [meldebild(ev)]),
        gruppen.length ? h('div', 'mb', [h('span', null, ['Mitalarmiert: ' + gruppen.join(', ')], { color: 'var(--grau)' })]) : null,
        warn.length ? h('div', 'chips', warn) : null]),
      h('div', 'card', [
        h('div', 'lab', ['Wer kommt' + (am ? ' · ' + am.name + (am.besatzung ? ' ' + am.besatzung : '') : '')]),
        am ? h('div', 'ampel', [h('span', 'dot', null, { background: amFarbe, boxShadow: '0 0 12px ' + amFarbe }), h('b', 'cond', [am.status]),
          h('span', null, [am.rows.map((r) => r.k + ' ' + (r.ok ? '✓' : r.ist + '/' + r.soll)).join(' · ')])]) : null,
        h('div', 'zahlen', zahlen)
      ]),
      h('div', 'card', [
        personen.length ? h('div', null, personen) : h('div', 'leer', ['Noch keine Zusagen']),
        offen.length ? h('div', 'offen', [offen.length + ' ohne Rückmeldung: ' + offen.map(name).join(', ')]) : null
      ])
    ]));
  };
  const renderKeinEinsatz = (app) => {
    refs.timer = null;
    const hist = ((D && D.lea && D.lea.history) || []).slice(0, 5);
    refs.uhr = h('div', 'uhr cond', [hhmm(jetzt())]);
    app.append(h('div', 'kopf', [refs.uhr, h('div', 'dat', ['Einsatz'])]), h('main', null, [
      h('div', 'card', [h('div', 'ruhig', [h('span', 'dot', null, leaOk() ? null : { background: 'var(--grau2)' }), leaOk() ? 'Kein laufender Einsatz' : 'Kein aktueller LEA-Stand'])]),
      h('div', 'card', [h('div', 'lab', ['Letzte Einsätze'])].concat(hist.length ? hist.map(histZeile) : [h('div', 'leer', ['noch keine Daten'])]))
    ]));
  };
  const histZeile = (ev) => {
    const l = ev.location || {};
    const wo = [[l.street, l.housenumber].filter(Boolean).join(' '), l.city].filter(Boolean).join(', ') || l.objectname || '';
    return h('div', 'zeile', [h('span', 'd', [ev.alarmtime ? tagKurz(ev.alarmtime) + ' ' + hhmm(ev.alarmtime) : '']),
      h('span', 'w', [h('span', 'cd', [ev.eventtype || '–'], chipStil(ev.eventtype)), ev.eventtypetext || '', wo ? h('small', null, [wo]) : null])]);
  };

  // ---------- Ansicht: Lage ----------
  const WETTER = { 0: 'klar', 1: 'überwiegend klar', 2: 'teils bewölkt', 3: 'bewölkt', 45: 'Nebel', 48: 'Raureifnebel', 51: 'leichter Niesel', 53: 'Niesel', 55: 'starker Niesel',
    56: 'gefrierender Niesel', 57: 'gefrierender Niesel', 61: 'leichter Regen', 63: 'Regen', 65: 'starker Regen', 66: 'gefrierender Regen', 67: 'gefrierender Regen',
    71: 'leichter Schneefall', 73: 'Schneefall', 75: 'starker Schneefall', 77: 'Schneegriesel', 80: 'Regenschauer', 81: 'Regenschauer', 82: 'heftige Schauer',
    85: 'Schneeschauer', 86: 'Schneeschauer', 95: 'Gewitter', 96: 'Gewitter mit Hagel', 99: 'Gewitter mit Hagel' };
  const RICHT = ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'];
  const UWZ = ['Vorwarnung', 'Gelb', 'Orange', 'Rot', 'Violett'];
  const ohneEmoji = (t) => String(t || '').replace(/[\p{Extended_Pictographic}\u{1F3FB}-\u{1F3FF}‍️]/gu, '').replace(/\s{2,}/g, ' ').trim();
  const renderLage = (app) => {
    refs.timer = null;
    const e = ex(), n = jetzt();
    const w = e.wetter && n - e.wetter.at < 3600e3 ? e.wetter : null;
    refs.uhr = h('div', 'uhr cond', [hhmm(n)]);
    const kopf = h('div', 'kopf', [refs.uhr,
      h('div', 'dat', [new Date(n).toLocaleDateString('de-AT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })]),
      w ? h('div', 'wet', [h('b', null, [Math.round(w.temp) + '°']), h('span', null, [(WETTER[w.code] || '') + ' · Wind ' + (w.dir != null ? RICHT[Math.round((((w.dir % 360) + 360) % 360) / 45) % 8] + ' ' : '') + Math.round(w.wind) + ' km/h, Böen ' + Math.round(w.boeen)])]) : null
    ], { background: 'var(--karte)' });
    const evs = einsaetze();
    const status = evs.length
      ? h('button', 'knopf', [evs.length === 1 ? 'Laufender Einsatz: ' + (evs[0].eventtype || '') + ' ' + (evs[0].eventtypetext || '') : evs.length + ' laufende Einsätze'])
      : h('div', 'ruhig', [h('span', 'dot', null, leaOk() ? null : { background: 'var(--grau2)' }), leaOk() ? 'Kein laufender Einsatz' : 'Kein aktueller LEA-Stand']);
    if (evs.length) status.onclick = () => wechseln('einsatz');
    const hist = ((D && D.lea && D.lea.history) || []).slice(0, 1);
    const warn = (e.uwz || []).map((x) => h('span', 'chip', ['⚠ ' + (x.tag === 'heute' ? 'Heute' : 'Morgen') + ' · ' + x.art + ' · ' + UWZ[Math.max(0, Math.min(4, x.stufe))]],
      { background: ['#94A3B8', '#FACC15', '#F97316', '#DC2626', '#9333EA'][Math.max(0, Math.min(4, x.stufe))], color: x.stufe === 1 ? '#111827' : '#fff' }));

    // Ausgerückt im Bezirk (WASTL + LSZ), eigene FF zuerst
    const wa = e.wastl && n - e.wastl.at < 30 * 60000 ? e.wastl : null;
    const ls = e.lsz && n - e.lsz.at < 30 * 60000 ? e.lsz : null;
    const eigen = (x) => cfg().eigeneFF && norm(x).indexOf(norm(cfg().eigeneFF)) !== -1;
    const kurzZeit = (z) => { const d = /(\d{2})\.(\d{2})\.\d{4}\s+(\d{2}):(\d{2})/.exec(z || ''); if (d) return d[1] + '.' + d[2] + '. ' + d[3] + ':' + d[4]; const u = /([<~>]\s*\d+)\s*std/i.exec(z || ''); return u ? u[1].replace(/\s+/g, ' ') + ' Std.' : ''; };
    const ffs = ((wa && wa.feuerwehren) || []).map((f) => Object.assign({ bezirk: 'BL' }, f)).concat((ls && ls.feuerwehren) || [])
      .sort((a, b) => (eigen(b.name) ? 1 : 0) - (eigen(a.name) ? 1 : 0));
    const bezirk = !wa && !ls ? [h('div', 'leer', ['keine aktuellen Daten'])]
      : ffs.length ? ffs.map((f) => h('div', 'zeile', [h('span', 'd', [f.dauer ? f.dauer.replace(/\s*h$/, ' Std.') : kurzZeit(f.zeit)]),
        h('span', 'w' + (eigen(f.name) ? ' eigen' : ''), [h('span', 'cd', [f.stufe || '–'], chipStil(f.stufe)), f.name + (f.bezirk ? ' (' + f.bezirk + ')' : ''), f.text ? h('small', null, [f.text]) : null])]))
        : [h('div', 'ruhig', [h('span', 'dot'), 'Keine Feuerwehr im Einsatz'])];

    // Pegel
    const pg = e.pegel && n - e.pegel.at < 3600e3 ? e.pegel : null;
    // Termine
    const seen = new Set();
    const termine = (cfg().termine || []).concat(e.kalender || []).map((t) => ({ d: new Date(t.start), titel: t.titel, ganz: t.ganztags }))
      .filter((t) => !isNaN(t.d) && t.d.getTime() > n - 2 * 3600e3).sort((a, b) => a.d - b.d)
      .filter((t) => { const k = t.d.getTime() + t.titel; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, cfg().termineAnzahl || 6)
      .map((t) => h('div', 'zeile', [h('span', 'd', [tagKurz(t.d.getTime()) + (t.ganz ? '' : ' ' + hhmm(t.d.getTime()))]), h('span', 'w', [ohneEmoji(t.titel)])]));

    app.append(kopf, h('main', null, [
      warn.length ? h('div', 'chips', warn) : null,
      h('div', 'card', [status].concat(hist.length ? [h('div', 'lab', ['Letzter Einsatz'], { marginTop: '12px' }), histZeile(hist[0])] : [])),
      daKarte(),
      h('div', 'card', [h('div', 'lab', ['Ausgerückt im Bezirk'])].concat(bezirk)),
      fahrzeugKurz(),
      pg ? h('div', 'card', [h('div', 'lab', ['Pegel ' + ((cfg().pegel && cfg().pegel.name) || '')]), h('div', 'mb', [Math.round(pg.wert) + ' cm' + (pg.prognose != null ? ' · Prognose ' + Math.round(pg.prognose) + ' cm' : '')])]) : null,
      h('div', 'card', [h('div', 'lab', ['Nächste Termine'])].concat(termine.length ? termine : [h('div', 'leer', ['keine Termine'])]))
    ]));
  };

  // ---------- „Ich bin da“ (über den Pi an die Anwesenheit) ----------
  // Die Karte bleibt beim Neuzeichnen erhalten, damit eine laufende Auswahl nicht verschwindet.
  let daBox = null;
  const daKarte = () => {
    if (daBox) return daBox;
    daBox = h('div', 'card');
    const inhalt = h('div');
    const zeig = (...kids) => { inhalt.textContent = ''; kids.forEach((k) => k && inhalt.appendChild(k)); };
    const senden = (wahl) => {
      zeig(h('div', 'leer', ['Wird eingetragen …']));
      fetch('/da', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(wahl) })
        .then((r) => r.json()).then((r) => {
          const ok = h('div', r.ok ? 'da-ok' : 'da-fehler', [r.ok ? '✓ ' + r.text : r.fehler]);
          const zur = h('button', 'knopf grau', ['Fertig'], { marginTop: '10px' }); zur.type = 'button'; zur.onclick = start;
          zeig(ok, zur);
        }).catch(() => zeig(h('div', 'da-fehler', ['Pi nicht erreichbar.'])));
    };
    const auswahl = () => {
      zeig(h('div', 'leer', ['Termine werden geladen …']));
      fetch('/da/start').then((r) => r.json()).then((d) => {
        if (!d.ok) return zeig(h('div', 'da-fehler', [d.fehler]));
        const liste = h('div', 'da-wahl');
        d.termine.forEach((t) => {
          const b = h('button', null, [t.titel, h('small', null, [t.text + (t.anzahl ? ' · ' + t.anzahl + ' da' : '')])]); b.type = 'button';
          b.onclick = () => senden({ termin: t.id }); liste.appendChild(b);
        });
        const sel = h('select'); [''].concat(d.arten).forEach((a) => { const o = h('option', null, [a || (d.termine.length ? 'Etwas anderes …' : 'Was machst du?')]); o.value = a; sel.appendChild(o); });
        sel.onchange = () => { if (sel.value) senden({ art: sel.value }); };
        liste.appendChild(sel);
        const ab = h('button', null, ['Abbrechen']); ab.type = 'button'; ab.onclick = start; liste.appendChild(ab);
        zeig(liste);
      }).catch(() => zeig(h('div', 'da-fehler', ['Pi nicht erreichbar.'])));
    };
    function start() {
      const b = h('button', 'knopf', ['Ich bin da ✓']); b.type = 'button'; b.onclick = auswahl;
      zeig(b);
    }
    daBox.append(h('div', 'lab', ['Anwesenheit']), inhalt);
    start();
    return daBox;
  };

  // ---------- Fahrzeuge ----------
  const pickerl = (pk, fz) => {
    if (!pk) return null;
    const lkw = (cfg().pickerlLkw || []).some((x) => norm(x) === norm(fz));
    const n = jetzt(), ende = new Date(pk.y, pk.m, 0, 23, 59).getTime(), ab = new Date(pk.y, pk.m - 1 - (lkw ? 3 : 1), 1).getTime();
    const t = 'Pickerl ' + pad(pk.m) + '/' + String(pk.y).slice(2);
    if (n > ende) return (lkw || n > new Date(pk.y, pk.m + 4, 0, 23, 59).getTime()) ? { t: t + ' abgelaufen', c: 'pk-rot' } : { t: t + ' – Toleranz', c: 'pk-rot' };
    return n >= ab ? { t: t + ' fällig', c: 'pk-bald' } : { t, c: '' };
  };
  const fzInfo = (fz) => {
    const n = jetzt(), fb = Array.isArray(ex().fahrtenbuch) ? ex().fahrtenbuch : [];
    const mine = fb.filter((e) => norm(e.fahrzeug) === norm(fz)).sort((a, b) => a.von - b.von);
    const st = (ex().fahrzeugStatus || []).find((x) => norm(x.fahrzeug) === norm(fz));
    const unterwegs = mine.find((e) => e.von <= n && e.bis >= n);
    const kommend = mine.filter((e) => e.von > n);
    let cls = 'g', status = 'frei', detail = unterwegs ? [unterwegs.name, unterwegs.zweck].filter(Boolean).join(' · ') : '';
    if (unterwegs) { cls = 'y'; status = 'unterwegs bis ' + wann(unterwegs.bis); }
    if (st && st.bereit && st.bereit !== 'ja') {
      cls = st.bereit === 'nein' ? 'r' : 'o';
      status = (st.bereit === 'nein' ? 'nicht einsatzbereit' : 'eingeschränkt') + (unterwegs ? ' · unterwegs bis ' + wann(unterwegs.bis) : '');
    }
    return { cls, status, detail, unterwegs, kommend, st, pk: pickerl(st && st.pickerl, fz) };
  };
  const fahrzeugKurz = () => {
    const fzs = cfg().fahrzeuge || []; if (!fzs.length) return null;
    return h('div', 'card', [h('div', 'lab', ['Fahrzeuge'])].concat(fzs.map((fz) => {
      const i = fzInfo(fz);
      const zusatz = i.st && i.st.mangel ? i.st.mangel : i.detail ? i.detail : i.kommend[0] ? 'nächste: ' + wann(i.kommend[0].von) + ' · ' + i.kommend[0].name : '';
      return h('div', 'zeile', [h('span', 'd cond', [fz], { fontSize: '18px', fontWeight: 700, color: 'var(--text)', width: '64px' }),
        h('span', 'w ' + i.cls, ['● ' + i.status, zusatz ? h('small', null, [zusatz]) : null])]);
    })));
  };
  const renderFahrzeuge = (app) => {
    refs.timer = null;
    const fzs = cfg().fahrzeuge || [];
    const karten = fzs.map((fz) => {
      const i = fzInfo(fz);
      return h('div', 'card fzk', [
        h('div', 'k', [h('b', null, [fz]), h('span', 'st ' + i.cls, ['● ' + i.status])]),
        i.st && i.st.mangel ? h('div', 'det', ['⚠ ' + i.st.mangel]) : null,
        i.unterwegs ? h('div', 'det', [i.detail + ' · seit ' + wann(i.unterwegs.von)]) : null,
        i.kommend.length ? h('div', 'fahrten', [h('div', 'lab', ['Gebucht'])].concat(i.kommend.slice(0, 5).map((e) =>
          h('div', 'zeile', [h('span', 'd', [wann(e.von)]), h('span', 'w', [e.name || '–', h('small', null, ['bis ' + wann(e.bis) + (e.zweck ? ' · ' + e.zweck : '')])])])))) : h('div', 'det', [h('span', null, ['keine Buchungen in den nächsten Tagen'], { color: 'var(--grau)' })]),
        i.pk ? h('span', 'pk ' + i.pk.c, [i.pk.t]) : null
      ]);
    });
    const url = cfg().fahrtenbuchFormUrl;
    let knopf = null;
    if (url) { knopf = h('a', 'knopf grau', ['Buchen / Kommando öffnen ↗']); knopf.href = url; knopf.target = '_blank'; knopf.rel = 'noopener'; }
    app.append(h('div', 'kopf', [h('div', 'uhr cond', ['Fahrzeuge'], { fontSize: '40px' })]), h('main', null, karten.concat([knopf])));
  };

  // ---------- Zeichnen ----------
  const zeichnen = (immer) => {
    const app = $('#app');
    const y = window.scrollY;
    app.textContent = '';
    if (fehler && !D) { app.append(h('div', 'kopf', [h('div', 'uhr cond', ['Einsatzmonitor'], { fontSize: '36px' })]), h('div', 'hinweis rot', [fehler])); return; }
    if (!D) { app.append(h('div', 'kopf', [h('div', 'leer', ['Noch keine Daten vom Pi. Läuft der Infoscreen?'])])); return; }
    if (!piOk()) app.append(h('div', 'hinweis rot', ['Keine Verbindung zum Pi seit ' + (empfangen ? wann(empfangen) : '–') + (fehler ? ' (' + fehler + ')' : '') + '. Angezeigt wird der letzte Stand.']));
    else if (!leaOk()) app.append(h('div', 'hinweis', ['Am Pi kommen gerade keine LEA-Daten an. Einsätze werden nicht angezeigt.']));
    if (tab === 'einsatz') renderEinsatz(app);
    else if (tab === 'fahrzeuge') renderFahrzeuge(app);
    else renderLage(app);
    app.append(h('div', 'fuss', ['Stand ' + (empfangen ? hhmm(empfangen) + ':' + pad(new Date(empfangen).getSeconds()) : '–') + ' · lea-skin ' + (ex().version || '?')]));
    document.querySelectorAll('.tabbar button').forEach((b) => b.classList.toggle('an', b.dataset.tab === tab));
    $('.tabbar .punkt').hidden = !einsaetze().length;
    if (!immer) window.scrollTo(0, y);
  };
  const wechseln = (t) => { tab = t; try { sessionStorage.setItem('tab', t); } catch (e) {} zeichnen(true); window.scrollTo(0, 0); };
  document.querySelectorAll('.tabbar button').forEach((b) => { b.onclick = () => wechseln(b.dataset.tab); });

  // ---------- Daten holen ----------
  const laden = async () => {
    try {
      const r = await fetch('/data', { cache: 'no-store' });
      if (!r.ok) throw new Error('Server ' + r.status);
      const j = await r.json();
      off = j.jetzt - Date.now(); empfangen = j.empfangen; fehler = '';
      const s = JSON.stringify(j.d);
      const neu = s !== letzteJson;
      if (neu) { letzteJson = s; D = j.d; }
      // neuer Einsatz -> auf „Einsatz“ springen
      const ids = einsaetze().map((e) => e.id || (e.alarmtime + ':' + e.eventtype));
      if (gesehen === null) { gesehen = new Set(ids); if (ids.length) tab = 'einsatz'; }
      else if (ids.some((id) => !gesehen.has(id))) { ids.forEach((id) => gesehen.add(id)); tab = 'einsatz'; evIdx = 0; try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} zeichnen(true); window.scrollTo(0, 0); return; }
      if (neu || !tab) { if (!tab) tab = 'lage'; zeichnen(); }
    } catch (e) {
      fehler = 'Pi nicht erreichbar – Tailscale am Handy eingeschaltet?';
      if (!tab) tab = 'lage';
      zeichnen();
    }
  };
  try { tab = sessionStorage.getItem('tab'); } catch (e) {}
  laden();
  let timer = setInterval(laden, 5000);
  document.addEventListener('visibilitychange', () => {
    clearInterval(timer);
    if (document.visibilityState === 'visible') { laden(); timer = setInterval(laden, 5000); }
  });
  setInterval(() => {
    if (refs.timer && refs.alarm) refs.timer.textContent = dauer(jetzt() - refs.alarm);
    if (refs.uhr && refs.uhr.isConnected) refs.uhr.textContent = hhmm(jetzt());
  }, 1000);
})();
</script>
</body>
</html>
