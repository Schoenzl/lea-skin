<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Einsatz">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Einsatzmonitor</title>
<style>
@font-face { font-family: A; font-weight: 400; src: url(/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: A; font-weight: 700; src: url(/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2'); font-display: swap; }
/* gleiche Farben und Bausteine wie die Handy-App (apps-script/Buchung.html) */
:root { --bg: #F2F4F7; --karte: #FFFFFF; --tief: #E9EDF2; --linie: #D5DBE3; --text: #111827; --grau: #475263; --grau2: #6B7684;
  --rotbtn: #B3122E; --gruen: #15803D; --gruen-t: #166534; --gruen-bg: #E3F4E8; --gelb: #D97706; --gelb-t: #8A3B0A; --gelb-bg: #FEF3C7;
  --orange: #D97706; --rot: #DC2626; --rot-t: #991B1B; --rot-bg: #FDE7E7; --tab: #FFFFFF; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0F1318; --karte: #1A2028; --tief: #262E39; --linie: #38414E; --text: #F3F4F6; --grau: #B4BCC8; --grau2: #8A94A3;
    --rotbtn: #C81E3A; --gruen: #22C55E; --gruen-t: #7EE2A8; --gruen-bg: #12301E; --gelb: #F59E0B; --gelb-t: #FCD34D; --gelb-bg: #3A2E10;
    --orange: #FB923C; --rot: #EF4444; --rot-t: #FCA5A5; --rot-bg: #3A1A1A; --tab: #161B23; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 19px/1.4 A, 'Atkinson Hyperlegible', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); min-height: 100vh; }
.cond { font-family: inherit; }
#app { max-width: 560px; margin: 0 auto; }
.kopf { padding: calc(env(safe-area-inset-top) + 16px) 18px 6px; }
.marke { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.logo { flex: none; width: 42px; height: 42px; border-radius: 10px; background: var(--rotbtn); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; }
.marke span { font-size: 17px; font-weight: 700; color: var(--grau); }
.titel { font-size: 32px; font-weight: 700; line-height: 1.15; margin: 4px 0 2px; }
main { padding: 12px 18px; display: grid; gap: 14px; }
.card { background: var(--karte); border: 1px solid var(--linie); border-radius: 18px; padding: 16px; }
.lab { font-size: 17px; font-weight: 700; color: var(--grau); margin-bottom: 8px; }
.leer { color: var(--grau); font-size: 17px; }
.hinweis { margin: 12px 18px 0; padding: 12px 14px; border-radius: 12px; font-size: 17px; font-weight: 700; background: var(--gelb-bg); color: var(--gelb-t); }
.hinweis.rot { background: var(--rot-bg); color: var(--rot-t); }

/* Alarmband – Farbe der Alarmstufe */
.band { margin: calc(env(safe-area-inset-top) + 12px) 18px 0; border-radius: 20px; padding: 18px; color: #fff; }
.band .z1 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stufe { font-weight: 700; font-size: 44px; line-height: 1; }
.art { font-weight: 700; font-size: 24px; line-height: 1.15; }
.band .z2 { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 18px; gap: 8px; }
.timer { font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; background: rgba(0,0,0,.22); padding: 2px 12px; border-radius: 10px; }
.band.hell { color: #111827; } .band.hell .timer { background: rgba(0,0,0,.12); }
.mehr { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.mehr button { font: inherit; font-weight: 700; font-size: 16px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid rgba(255,255,255,.6); background: transparent; color: inherit; }
.band.hell .mehr button { border-color: rgba(0,0,0,.45); }
.mehr button.an { background: rgba(255,255,255,.92); color: #111827; border-color: transparent; }

.strasse { font-weight: 700; font-size: 30px; line-height: 1.1; }
.stadt { font-size: 18px; color: var(--grau); margin-top: 2px; }
.zusatz { margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-size: 17px; font-weight: 700; background: var(--gelb-bg); color: var(--gelb-t); }
.karte { position: relative; height: 220px; border-radius: 14px; margin-top: 12px; overflow: hidden; background: #E9E5DC; }
.karte img { position: absolute; width: 256px; height: 256px; }
.karte .pin { position: absolute; left: 50%; top: 50%; width: 30px; height: 40px; transform: translate(-50%, -100%); }
.karte .nav { position: absolute; right: 10px; bottom: 10px; background: var(--rotbtn); color: #fff; font-weight: 700; font-size: 17px; min-height: 48px; display: flex; align-items: center; padding: 0 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.3); text-decoration: none; }
.karte .hyd { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: #1D4ED8; color: #fff; border: 2px solid #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.45); font: 700 12px/20px A, sans-serif; text-align: center; }
.karte .hyd.winter { background: #64748B; }
.hyd-liste { margin-top: 12px; display: grid; gap: 0; }
.hyd-z { display: flex; gap: 12px; align-items: center; min-height: 56px; padding: 6px 0; border-top: 1px solid var(--linie); font-size: 17px; }
.hyd-z .n { flex: none; min-width: 30px; text-align: center; border-radius: 8px; background: #1D4ED8; color: #fff; font: 700 15px/26px A, sans-serif; }
.hyd-z .w { flex: 1; min-width: 0; font-weight: 700; }
.hyd-z .w small { display: block; color: var(--grau); font-size: 15px; font-weight: 400; }
.hyd-z .m { flex: none; font-weight: 700; font-size: 17px; }
.karte .keine { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #555; font-size: 17px; }
.mb { font-size: 18px; line-height: 1.45; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { font-size: 16px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--tief); }
.chip.warn { background: var(--gelb-bg); color: var(--gelb-t); } .chip.stop { background: var(--rot-bg); color: var(--rot-t); }

.ampel { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px; background: var(--tief); }
.ampel .dot { width: 20px; height: 20px; border-radius: 50%; flex: none; }
.ampel b { font-size: 24px; font-weight: 700; }
.ampel span { color: var(--grau); font-size: 17px; }
.zahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; margin-top: 12px; }
.zahl { background: var(--tief); border-radius: 14px; padding: 10px 4px; text-align: center; }
.zahl .n { font-weight: 700; font-size: 30px; line-height: 1; }
.zahl .t { font-size: 15px; color: var(--grau); margin-top: 4px; }
.p { display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px 0; border-top: 1px solid var(--linie); }
.p:first-child { border-top: 0; }
.p .r { width: 26px; flex: none; color: var(--grau2); font-weight: 700; font-size: 18px; }
.p .nm { font-weight: 700; font-size: 18px; flex: 1; min-width: 0; }
.p .nm small { display: block; color: var(--grau); font-weight: 400; font-size: 15px; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.f { font-weight: 700; font-size: 15px; padding: 2px 8px; border-radius: 6px; }
.p.nein { opacity: .5; } .p.nein .nm { text-decoration: line-through; }
.offen { color: var(--grau); font-size: 16px; padding-top: 10px; border-top: 1px solid var(--linie); margin-top: 4px; }

/* Lage */
.uhr { font-weight: 700; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.dat { color: var(--grau); font-size: 18px; margin-top: 4px; }
.wet { display: flex; gap: 12px; align-items: center; margin-top: 12px; font-size: 17px; color: var(--grau); }
.wet b { font-size: 32px; color: var(--text); }
.ruhig { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; }
.ruhig .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--gruen); flex: none; }
.zeile { display: flex; gap: 12px; min-height: 56px; padding: 10px 0; border-top: 1px solid var(--linie); font-size: 17px; align-items: baseline; }
.zeile:first-of-type, .lab + .zeile { border-top: 0; }
.zeile .d { width: 92px; flex: none; color: var(--grau); font-size: 16px; }
.zeile .w { flex: 1; min-width: 0; }
.zeile .w small { display: block; color: var(--grau); font-size: 15px; }
.cd { font-weight: 700; font-size: 15px; padding: 1px 8px; border-radius: 6px; margin-right: 6px; }
.eigen { color: var(--rot-t); font-weight: 700; }
.knopf { display: flex; align-items: center; justify-content: center; text-align: center; font: inherit; font-weight: 700; font-size: 20px; min-height: 60px; padding: 0 16px; border-radius: 16px; border: 0; background: var(--rotbtn); color: #fff; text-decoration: none; width: 100%; }
.knopf.grau { background: var(--karte); color: var(--text); border: 2px solid var(--linie); }
.da-wahl { display: grid; gap: 10px; margin-top: 10px; }
.da-wahl button { text-align: left; font: inherit; font-size: 18px; font-weight: 700; min-height: 60px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--linie); background: var(--karte); color: var(--text); }
.da-wahl button small { display: block; color: var(--grau); font-size: 15px; font-weight: 400; margin-top: 2px; }
.da-wahl select { font: inherit; font-size: 18px; min-height: 58px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--linie); background: var(--karte); color: var(--text); }
.nachbar { background: var(--rot-bg); border-color: transparent; }
.nachbar .lab { color: var(--rot-t); }
.nachbar .zeile { border-color: var(--linie); }
.haus-t { padding: 10px 0; border-top: 1px solid var(--linie); font-size: 17px; cursor: pointer; }
.haus-t:first-child { border-top: 0; padding-top: 0; }
.haus-t b { font-size: 18px; }
.haus-t small { color: var(--grau); font-size: 15px; }
.haus-t .namen { margin-top: 4px; }
.haus-t .pf { float: right; color: var(--grau); transition: transform .15s; font-size: 22px; line-height: 1; }
.haus-t.auf .pf { transform: rotate(90deg); }
.haus-t .det { display: none; margin-top: 6px; }
.haus-t.auf .det { display: block; }
.haus-t .det div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 8px; font-size: 16px; }
.haus-t .det div:nth-child(odd) { background: var(--tief); }
.haus-t .det div span { color: var(--grau); white-space: nowrap; }
.haus-t .det div.weg { color: var(--grau); text-decoration: line-through; }
.haus-t .det div.weg span { text-decoration: none; }
.da-ok { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--gruen-bg); color: var(--gruen-t); font-weight: 700; }
.da-fehler { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--rot-bg); color: var(--rot-t); font-weight: 700; }

/* Fahrzeuge – Karte mit Farbstreifen wie in der App */
.fzk { position: relative; padding-left: 26px; overflow: hidden; }
.fzk::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--gruen); }
.fzk.c-y::before, .fzk.c-o::before { background: var(--gelb); } .fzk.c-r::before { background: var(--rot); }
.fzk .k { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fzk .k b { font-size: 26px; font-weight: 700; }
.st { display: inline-block; font-size: 16px; font-weight: 700; padding: 3px 12px; border-radius: 999px; }
.st.g { background: var(--gruen-bg); color: var(--gruen-t); } .st.y, .st.o { background: var(--gelb-bg); color: var(--gelb-t); } .st.r { background: var(--rot-bg); color: var(--rot-t); }
.fzk .det { font-size: 17px; margin-top: 8px; }
.fzk .det.warnung { padding: 10px 12px; border-radius: 12px; background: var(--gelb-bg); color: var(--gelb-t); font-weight: 700; }
.fzk .pk { display: inline-block; margin-top: 12px; font-size: 16px; font-weight: 700; padding: 3px 12px; border-radius: 999px; background: var(--tief); color: var(--grau); }
.pk-bald { background: var(--gelb-bg) !important; color: var(--gelb-t) !important; } .pk-rot { background: var(--rot-bg) !important; color: var(--rot-t) !important; }
.fahrten { margin-top: 12px; }
.g { color: var(--gruen-t); } .y, .o { color: var(--gelb-t); } .r { color: var(--rot-t); }

.fuss { text-align: center; font-size: 15px; color: var(--grau); padding: 8px 18px 16px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--tab); border-top: 1px solid var(--linie);
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); text-align: center; z-index: 5; }
.tabbar button { font: inherit; font-size: 15px; font-weight: 700; color: var(--grau2); background: none; border: 0; min-height: 60px; padding: 4px 0; position: relative; }
.tabbar button.an { color: var(--text); }
.tabbar button.an::after { content: ''; position: absolute; left: 30%; right: 30%; top: -7px; height: 4px; border-radius: 0 0 4px 4px; background: var(--rotbtn); }
.tabbar svg { display: block; margin: 0 auto 2px; width: 26px; height: 26px; }
.tabbar .punkt { position: absolute; top: 4px; left: calc(50% + 10px); width: 12px; height: 12px; border-radius: 50%; background: var(--rot); box-shadow: 0 0 8px var(--rot); }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid var(--gelb); outline-offset: 2px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"><div class="kopf"><div class="leer">wird geladen …</div></div></div>
<nav class="tabbar">
  <button type="button" data-tab="einsatz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18v-6a5 5 0 0 1 10 0v6"/><path d="M5 21h14v-3H5z"/><path d="M12 2v2M4.2 5.2l1.4 1.4M19.8 5.2l-1.4 1.4"/></svg>Einsatz<span class="punkt" hidden></span></button>
  <button type="button" data-tab="lage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/></svg>Lage</button>
  <button type="button" data-tab="fahrzeuge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16V7h11v9"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>Fahrzeuge</button>
</nav>
<script>
(() => {
  // ---------- Hilfen ----------
  const $ = (s) => document.querySelector(s);
  const h = (tag, cls, kids, style) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (style) Object.assign(e.style, style);
    (kids || []).forEach((k) => { if (k == null || k === '' || k === false) return; e.appendChild(typeof k === 'string' || typeof k === 'number' ? document.createTextNode(String(k)) : k); });
    return e;
  };
  const marke = () => h('div', 'marke', [h('div', 'logo', ['FF']), h('span', null, ['FF Deutsch Haslau'])]);
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '').toLowerCase();
  const pad = (n) => String(n).padStart(2, '0');
  const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const hhmm = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const tagKurz = (t) => { const d = new Date(t); return WT[d.getDay()] + ' ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.'; };
  const gleicherTag = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
  const wann = (t) => (gleicherTag(t, jetzt()) ? '' : gleicherTag(t, jetzt() + 864e5) ? 'morgen ' : tagKurz(t) + ' ') + hhmm(t);
  const dauer = (ms) => { let s = Math.max(0, Math.floor(ms / 1000)); const hh = Math.floor(s / 3600); s -= hh * 3600; const m = Math.floor(s / 60); s -= m * 60; return (hh ? hh + ':' + pad(m) : pad(m)) + ':' + pad(s); };
  const istHell = (hex) => { const m = String(hex || '').replace('#', '').match(/^(..)(..)(..)$/); if (!m) return false; const [r, g, b] = m.slice(1).map((x) => parseInt(x, 16)); return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6; };

  let D = null, off = 0, empfangen = 0, letzteJson = '', tab = null, evIdx = 0, gesehen = null, fehler = '';
  const jetzt = () => Date.now() + off;
  const cfg = () => (D && D.cfg) || {};
  const ex = () => (D && D.extra) || {};
  const farbe = (t) => { const f = cfg().farben || {}; return f[String(t || '').charAt(0).toUpperCase()] || f.default || '#4B5563'; };
  const chipStil = (t) => { const c = farbe(t); return istHell(c) ? { background: c, color: '#111827' } : { background: c, color: '#fff' }; };
  const piOk = () => empfangen && jetzt() - empfangen < 30000;
  const leaOk = () => D && D.lea && D.lea.at && jetzt() - D.lea.at < 90000;
  const einsaetze = () => (piOk() && leaOk() && Array.isArray(D.lea.events) ? D.lea.events : []);

  // ---------- Einsatz-Logik (wie am Infoscreen) ----------
  const fnKeys = () => Object.keys(cfg().funktionen || {});
  const fnStil = (s) => { const k = fnKeys().find((x) => norm(x) === norm(s)); return k ? cfg().funktionen[k] : { bg: '#2A3340', fg: '#F2F4F7' }; };
  const fnOrd = (s) => { const i = fnKeys().findIndex((x) => norm(x) === norm(s)); return i < 0 ? 99 : i; };
  const hasFn = (p, k) => (p.functions || []).some((f) => norm(f.shortname) === norm(k));
  const elRank = (p) => { const i = (cfg().elListe || []).findIndex(([v, n]) => norm(v) === norm(p.firstname) && norm(n) === norm(p.lastname)); return i >= 0 ? i + 1 : null; };
  const meldebild = (ev) => {
    let t = String(ev.additionalinformation || '').trim();
    t = t.replace(/^\S+\s+\(\d{1,2}:\d{2}\)\s*/, '').replace(/\s*\(\s*-?\d+\.\d+\s*,\s*-?\d+\.\d+\s*\)\s*$/, '');
    const i = t.indexOf(': ');
    return (i >= 0 ? t.slice(i + 2).trim() : '') || t;
  };
  const ampel = (ja) => {
    const F = cfg().fahrzeug; if (!F) return null;
    const slots = []; F.rollen.forEach((r) => { for (let i = 0; i < r.anzahl; i++) slots.push(r.kuerzel); });
    const n = slots.length, voll = Math.pow(2, n + 1) - 2;
    let best = [], bestS = -1; const used = new Set(), cur = [];
    const score = (a) => a.reduce((s, v, i) => s + (v != null ? Math.pow(2, n - i) : 0), 0);
    const dfs = (i, minJ) => {
      if (bestS === voll) return;
      if (i === n) { const sc = score(cur); if (sc > bestS) { bestS = sc; best = cur.slice(); } return; }
      const wie = i > 0 && slots[i] === slots[i - 1];
      for (let j = wie ? minJ : 0; j < ja.length; j++) {
        if (used.has(j) || !hasFn(ja[j], slots[i])) continue;
        used.add(j); cur.push(j); dfs(i + 1, j + 1); cur.pop(); used.delete(j);
        if (bestS === voll) return;
      }
      cur.push(null); dfs(i + 1, wie ? minJ : 0); cur.pop();
    };
    dfs(0, 0);
    const rows = F.rollen.map((r) => { const ist = best.filter((v, i) => v != null && slots[i] === r.kuerzel).length; return { k: r.kuerzel, ist, soll: r.anzahl, ok: ist >= r.anzahl, pflicht: r.pflicht }; });
    const gesOk = ja.length >= (F.mindestGesamt || 0);
    let status = 'besetzbar';
    if (rows.some((r) => r.pflicht && !r.ok)) status = 'nicht besetzbar';
    else if (rows.some((r) => !r.ok) || !gesOk) status = 'knapp';
    return { rows, status, name: F.name, besatzung: F.besatzung };
  };

  // ---------- Karte ----------
  const koord = (ev) => {
    const l = ev.location || {}; const a = Number(l.x), b = Number(l.y);
    if (!isFinite(a) || !isFinite(b) || (!a && !b)) return null;
    return { lat: Math.max(a, b), lon: Math.min(a, b) };
  };
  const navLink = (k, adr) => /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)

          const w = h('div', 'haus-t' + (offenAuf[t.id] ? ' auf' : ''), [
            h('span', 'pf', ['›']), h('b', null, [t.titel]),
            h('small', null, [' · ' + (offen ? 'seit ' + hhmm(t.beginn) : hhmm(t.beginn) + '–' + (t.ende ? hhmm(t.ende) : '')) + ' · ' + (offen ? da.length + ' da' + (weg.length ? ', ' + weg.length + ' weg' : '') : t.personen.length + ' Pers.')]),
            h('div', 'namen', [(offen ? da : t.personen).map((p) => p.name).join(', ') || 'alle schon gegangen']), det]);
          w.onclick = () => { offenAuf[t.id] = !offenAuf[t.id]; w.classList.toggle('auf'); };
          haus.appendChild(w);
        });
      }).catch(() => {});
    }
    setTimeout(hausLaden, 300); setInterval(hausLaden, 60000);
    document.addEventListener('visibilitychange', hausLaden);
    daBox.append(h('div', 'lab', ['Heute im Feuerwehrhaus']), haus, inhalt);
    start();
    return daBox;
  };

  // ---------- Fahrzeuge ----------
  const pickerl = (pk, fz) => {
    if (!pk) return null;
    const lkw = (cfg().pickerlLkw || []).some((x) => norm(x) === norm(fz));
    const n = jetzt(), ende = new Date(pk.y, pk.m, 0, 23, 59).getTime(), ab = new Date(pk.y, pk.m - 1 - (lkw ? 3 : 1), 1).getTime();
    const t = 'Pickerl ' + pad(pk.m) + '/' + String(pk.y).slice(2);
    if (n > ende) return (lkw || n > new Date(pk.y, pk.m + 4, 0, 23, 59).getTime()) ? { t: t + ' abgelaufen', c: 'pk-rot' } : { t: t + ' – Toleranz', c: 'pk-rot' };
    return n >= ab ? { t: t + ' fällig', c: 'pk-bald' } : { t, c: '' };
  };
  const fzInfo = (fz) => {
    const n = jetzt(), fb = Array.isArray(ex().fahrtenbuch) ? ex().fahrtenbuch : [];
    const mine = fb.filter((e) => norm(e.fahrzeug) === norm(fz)).sort((a, b) => a.von - b.von);
    const st = (ex().fahrzeugStatus || []).find((x) => norm(x.fahrzeug) === norm(fz));
    const unterwegs = mine.find((e) => e.von <= n && e.bis >= n);
    const kommend = mine.filter((e) => e.von > n);
    let cls = 'g', status = 'frei', detail = unterwegs ? [unterwegs.name, unterwegs.zweck].filter(Boolean).join(' · ') : '';
    if (unterwegs) { cls = 'y'; status = 'unterwegs bis ' + wann(unterwegs.bis); }
    if (st && st.bereit && st.bereit !== 'ja') {
      cls = st.bereit === 'nein' ? 'r' : 'o';
      status = (st.bereit === 'nein' ? 'nicht einsatzbereit' : 'eingeschränkt') + (unterwegs ? ' · unterwegs bis ' + wann(unterwegs.bis) : '');
    }
    return { cls, status, detail, unterwegs, kommend, st, pk: pickerl(st && st.pickerl, fz) };
  };
  const fahrzeugKurz = () => {
    const fzs = cfg().fahrzeuge || []; if (!fzs.length) return null;
    return h('div', 'card', [h('div', 'lab', ['Fahrzeuge'])].concat(fzs.map((fz) => {
      const i = fzInfo(fz);
      const zusatz = i.st && i.st.mangel ? i.st.mangel : i.detail ? i.detail : i.kommend[0] ? 'nächste: ' + wann(i.kommend[0].von) + ' · ' + i.kommend[0].name : '';
      return h('div', 'zeile', [h('span', 'd cond', [fz], { fontSize: '18px', fontWeight: 700, color: 'var(--text)', width: '64px' }),
        h('span', 'w', [h('span', 'st ' + i.cls, [i.status.charAt(0).toUpperCase() + i.status.slice(1)]), zusatz ? h('small', null, [zusatz]) : null])]);
    })));
  };
  const renderFahrzeuge = (app) => {
    refs.timer = null;
    const fzs = cfg().fahrzeuge || [];
    const karten = fzs.map((fz) => {
      const i = fzInfo(fz);
      return h('div', 'card fzk c-' + i.cls, [
        h('div', 'k', [h('b', null, [fz]), h('span', 'st ' + i.cls, [i.status.charAt(0).toUpperCase() + i.status.slice(1)])]),
        i.st && i.st.mangel ? h('div', 'det warnung', [i.st.mangel]) : null,
        i.unterwegs ? h('div', 'det', [i.detail + ' · seit ' + wann(i.unterwegs.von)]) : null,
        i.kommend.length ? h('div', 'fahrten', [h('div', 'lab', ['Gebucht'])].concat(i.kommend.slice(0, 5).map((e) =>
          h('div', 'zeile', [h('span', 'd', [wann(e.von)]), h('span', 'w', [e.name || '–', h('small', null, ['bis ' + wann(e.bis) + (e.zweck ? ' · ' + e.zweck : '')])])])))) : h('div', 'det', [h('span', null, ['keine Buchungen in den nächsten Tagen'], { color: 'var(--grau)' })]),
        i.pk ? h('span', 'pk ' + i.pk.c, [i.pk.t]) : null
      ]);
    });
    const url = cfg().fahrtenbuchFormUrl;
    let knopf = null;
    if (url) { knopf = h('a', 'knopf grau', ['Handy-App öffnen (Buchen, Verwaltung)']); knopf.href = url; knopf.target = '_blank'; knopf.rel = 'noopener'; }
    app.append(h('div', 'kopf', [marke(), h('div', 'titel', ['Fahrzeuge'])]), h('main', null, karten.concat([knopf])));
  };

  // ---------- Zeichnen ----------
  const zeichnen = (immer) => {
    const app = $('#app');
    const y = window.scrollY;
    app.textContent = '';
    if (fehler && !D) { app.append(h('div', 'kopf', [marke(), h('div', 'titel', ['Einsatzmonitor'])]), h('div', 'hinweis rot', [fehler])); return; }
    if (!D) { app.append(h('div', 'kopf', [marke(), h('div', 'titel', ['Einsatzmonitor']), h('div', 'leer', ['Noch keine Daten vom Pi. Läuft der Infoscreen?'])])); return; }
    if (!piOk()) app.append(h('div', 'hinweis rot', ['Keine Verbindung zum Pi seit ' + (empfangen ? wann(empfangen) : '–') + (fehler ? ' (' + fehler + ')' : '') + '. Angezeigt wird der letzte Stand.']));
    else if (!leaOk()) app.append(h('div', 'hinweis', ['Am Pi kommen gerade keine LEA-Daten an. Einsätze werden nicht angezeigt.']));
    if (tab === 'einsatz') renderEinsatz(app);
    else if (tab === 'fahrzeuge') renderFahrzeuge(app);
    else renderLage(app);
    app.append(h('div', 'fuss', ['Stand ' + (empfangen ? hhmm(empfangen) + ':' + pad(new Date(empfangen).getSeconds()) : '–') + ' · lea-skin ' + (ex().version || '?')]));
    document.querySelectorAll('.tabbar button').forEach((b) => b.classList.toggle('an', b.dataset.tab === tab));
    $('.tabbar .punkt').hidden = !einsaetze().length;
    if (!immer) window.scrollTo(0, y);
  };
  const wechseln = (t) => { tab = t; try { sessionStorage.setItem('tab', t); } catch (e) {} zeichnen(true); window.scrollTo(0, 0); };
  document.querySelectorAll('.tabbar button').forEach((b) => { b.onclick = () => wechseln(b.dataset.tab); });

  // ---------- Daten holen ----------
  const laden = async () => {
    try {
      const r = await fetch('/data', { cache: 'no-store' });
      if (!r.ok) throw new Error('Server ' + r.status);
      const j = await r.json();
      off = j.jetzt - Date.now(); empfangen = j.empfangen; fehler = '';
      const s = JSON.stringify(j.d);
      const neu = s !== letzteJson;
      if (neu) { letzteJson = s; D = j.d; }
      // neuer Einsatz -> auf „Einsatz“ springen
      const ids = einsaetze().map((e) => e.id || (e.alarmtime + ':' + e.eventtype));
      if (gesehen === null) { gesehen = new Set(ids); if (ids.length) tab = 'einsatz'; }
      else if (ids.some((id) => !gesehen.has(id))) { ids.forEach((id) => gesehen.add(id)); tab = 'einsatz'; evIdx = 0; try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} zeichnen(true); window.scrollTo(0, 0); return; }
      if (neu || !tab) { if (!tab) tab = 'lage'; zeichnen(); }
    } catch (e) {
      fehler = 'Pi nicht erreichbar – Tailscale am Handy eingeschaltet?';
      if (!tab) tab = 'lage';
      zeichnen();
    }
  };
  try { tab = sessionStorage.getItem('tab'); } catch (e) {}
  laden();
  let timer = setInterval(laden, 5000);
  document.addEventListener('visibilitychange', () => {
    clearInterval(timer);
    if (document.visibilityState === 'visible') { laden(); timer = setInterval(laden, 5000); }
  });
  setInterval(() => {
    if (refs.timer && refs.alarm) refs.timer.textContent = dauer(jetzt() - refs.alarm);
    if (refs.uhr && refs.uhr.isConnected) refs.uhr.textContent = hhmm(jetzt());
  }, 1000);
})();
</script>
</body>
</html>
