<!DOCTYPE html>
<html lang="de">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --rot: #B3122E; --text: #111827; --grau: #5B6573; --linie: #DDE2E9; --bg: #EEF1F5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background: var(--rot); color: #fff; padding: 16px; }
  header h1 { margin: 0; font-size: 20px; } header p { margin: 2px 0 0; opacity: .85; font-size: 14px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .karte { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 0 0 1px var(--linie); margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--grau); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; font: inherit; padding: 12px; border: 1px solid #C5CCD6; border-radius: 8px; background: #fff; color: var(--text); }
  .fz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fz button { font: inherit; font-weight: 700; padding: 14px 0; border-radius: 8px; border: 2px solid #C5CCD6; background: #fff; color: var(--text); }
  .fz button.an { border-color: var(--rot); background: #FDECEF; color: var(--rot); }
  .zeit { display: grid; grid-template-columns: 1fr; gap: 0; }
  input { min-width: 0; max-width: 100%; }
  .los { width: 100%; margin-top: 18px; font: inherit; font-weight: 700; font-size: 18px; padding: 14px; border: 0; border-radius: 10px; background: var(--rot); color: #fff; }
  .los:disabled { opacity: .5; }
  .meldung { display: none; white-space: pre-line; margin-top: 14px; padding: 12px; border-radius: 8px; font-weight: 600; }
  .meldung.fehler { display: block; background: #FDECEC; color: #991B1B; box-shadow: inset 4px 0 0 #DC2626; }
  .meldung.ok { display: block; background: #E8F7EE; color: #166534; box-shadow: inset 4px 0 0 #16A34A; }
  h2 { font-size: 15px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .5px; color: var(--grau); }
  .b { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--linie); }
  .b:first-of-type { border-top: 0; }
  .b .fzk { flex: none; width: 58px; font-weight: 800; }
  .b .info { flex: 1; min-width: 0; font-size: 14px; }
  .b .info span { color: var(--grau); }
  .b button { flex: none; font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid #C5CCD6; background: #fff; color: var(--grau); }
  .leer { color: var(--grau); font-size: 14px; }
</style>
</head>
<body>
<header><h1>Fahrzeug buchen</h1><p>FF Deutsch Haslau · Fahrzeugnutzung</p></header>
<main>
  <div class="karte">
    <label>Fahrzeug</label>
    <div class="fz" id="fz"></div>
    <label for="name">Name (Vor- und Nachname)</label>
    <input id="name" list="namen" autocomplete="name" placeholder="z. B. Max Mustermann">
    <datalist id="namen"></datalist>
    <label for="mail">E-Mail (für Nachrichten zur Buchung)</label>
    <input id="mail" type="email" autocomplete="email" inputmode="email" placeholder="name@beispiel.at">
    <div class="zeit">
      <div><label for="von">Von</label><input id="von" type="datetime-local"></div>
      <div><label for="bis">Bis</label><input id="bis" type="datetime-local"></div>
    </div>
    <label for="zweck">Zweck</label>
    <input id="zweck" maxlength="120" placeholder="z. B. Übung, Besorgung, Werkstatt">
    <button class="los" id="los">Buchen</button>
    <div class="meldung" id="meldung"></div>
  </div>
  <div class="karte">
    <h2>Gebucht – nächste 30 Tage</h2>
    <div id="liste"><div class="leer">wird geladen …</div></div>
  </div>
</main>
<script>
  let fahrzeug = '', daten = null;
  const $ = (id) => document.getElementById(id);
  const melden = (text, art) => { const m = $('meldung'); m.textContent = text; m.className = 'meldung ' + art; };
  const pad = (n) => String(n).padStart(2, '0');
  const lokal = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  try { $('name').value = localStorage.getItem('fz-name') || ''; $('mail').value = localStorage.getItem('fz-mail') || ''; } catch (e) {}

  // Vorschlag: nächste volle Stunde, 2 Stunden
  const start = new Date(); start.setMinutes(0, 0, 0); start.setHours(start.getHours() + 1);
  $('von').value = lokal(start); $('bis').value = lokal(new Date(start.getTime() + 2 * 3600e3));
  $('von').addEventListener('change', () => {
    const v = new Date($('von').value), b = new Date($('bis').value);
    if (!(b > v)) $('bis').value = lokal(new Date(v.getTime() + 2 * 3600e3));
  });

  const zeigen = (d) => {
    daten = d;
    $('fz').textContent = '';
    d.fahrzeuge.forEach((f) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = f;
      if (f === fahrzeug) b.className = 'an';
      b.onclick = () => { fahrzeug = f; zeigen(daten); };
      $('fz').appendChild(b);
    });
    $('namen').textContent = '';
    d.namen.forEach((n) => { const o = document.createElement('option'); o.value = n; $('namen').appendChild(o); });
    const l = $('liste'); l.textContent = '';
    const liste = fahrzeug ? d.kommend.filter((x) => x.fahrzeug === fahrzeug) : d.kommend;
    if (!liste.length) { const e = document.createElement('div'); e.className = 'leer'; e.textContent = fahrzeug ? fahrzeug + ' ist in den nächsten 30 Tagen frei.' : 'Keine Buchungen.'; l.appendChild(e); }
    liste.forEach((x) => {
      const row = document.createElement('div'); row.className = 'b';
      const k = document.createElement('div'); k.className = 'fzk'; k.textContent = x.fahrzeug;
      const i = document.createElement('div'); i.className = 'info'; i.textContent = x.text;
      const s = document.createElement('span'); s.textContent = ' · ' + x.name + (x.zweck ? ' · ' + x.zweck : ''); i.appendChild(s);
      const a = document.createElement('button'); a.type = 'button'; a.textContent = 'Absagen';
      a.onclick = () => {
        const wer = $('name').value.trim();
        if (wer.length < 3) { melden('Zum Absagen oben deinen Namen eintragen.', 'fehler'); $('name').focus(); return; }
        if (!confirm('Buchung ' + x.fahrzeug + ' ' + x.text + ' (' + x.name + ') absagen?')) return;
        google.script.run.withSuccessHandler((r) => { melden(r.ok ? r.text : r.fehler, r.ok ? 'ok' : 'fehler'); laden(); })
          .withFailureHandler((e) => melden('Fehler: ' + e.message, 'fehler')).absagen(x.zeile, wer);
      };
      row.append(k, i, a); l.appendChild(row);
    });
  };
  const laden = () => google.script.run.withSuccessHandler(zeigen)
    .withFailureHandler((e) => { $('liste').textContent = 'Konnte nicht geladen werden: ' + e.message; }).startdaten();

  $('los').onclick = () => {
    if (!fahrzeug) return melden('Bitte ein Fahrzeug auswählen.', 'fehler');
    const d = { fahrzeug, name: $('name').value.trim(), mail: $('mail').value.trim(), von: $('von').value, bis: $('bis').value, zweck: $('zweck').value.trim() };
    try { localStorage.setItem('fz-name', d.name); localStorage.setItem('fz-mail', d.mail); } catch (e) {}
    $('los').disabled = true; melden('Wird geprüft …', 'ok');
    google.script.run
      .withSuccessHandler((r) => { $('los').disabled = false; melden(r.ok ? '✓ ' + r.text : r.fehler, r.ok ? 'ok' : 'fehler'); if (r.ok) { $('zweck').value = ''; laden(); } })
      .withFailureHandler((e) => { $('los').disabled = false; melden('Fehler: ' + e.message, 'fehler'); })
      .buchen(d);
  };
  laden();
</script>
</body>
</html>
