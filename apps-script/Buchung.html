<!DOCTYPE html>
<html lang="de">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F4F7; --card: #FFFFFF; --text: #111827; --sub: #475263; --linie: #D5DBE3; --grau: #E9EDF2;
    --rot: #B3122E;
    --gruen: #166534; --gruen-bg: #E3F4E8; --gruen-btn: #15803D;
    --gelb: #8A3B0A; --gelb-bg: #FEF3C7; --gelb-band: #D97706;
    --aus: #991B1B; --aus-bg: #FDE7E7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1318; --card: #1A2028; --text: #F3F4F6; --sub: #B4BCC8; --linie: #38414E; --grau: #262E39;
      --rot: #C81E3A;
      --gruen: #7EE2A8; --gruen-bg: #12301E; --gruen-btn: #15803D;
      --gelb: #FCD34D; --gelb-bg: #3A2E10; --gelb-band: #F59E0B;
      --aus: #FCA5A5; --aus-bg: #3A1A1A;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 19px/1.4 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  #app { max-width: 560px; margin: 0 auto; padding: 0 18px 48px; min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { flex: none; }
  h1 { margin: 10px 0 16px; font-size: 32px; line-height: 1.15; }
  p { margin: 0 0 12px; }
  .sub { color: var(--sub); }
  .klein { font-size: 17px; }
  .kopf { display: flex; align-items: center; gap: 12px; padding-top: 22px; }
  .logo { flex: none; width: 42px; height: 42px; border-radius: 10px; background: var(--rot); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; }
  .logo.rund { background: var(--grau); color: var(--text); border-radius: 50%; width: 46px; height: 46px; }
  .kopf .ff { flex: 1; font-size: 17px; font-weight: 700; color: var(--sub); }
  .bar { display: flex; align-items: center; height: 64px; margin-left: -8px; }
  .zurueck { display: flex; align-items: center; gap: 2px; min-height: 52px; padding: 0 14px 0 4px; border: 0; border-radius: 12px; background: transparent; font-size: 19px; font-weight: 700; }
  .label { display: block; font-size: 17px; font-weight: 700; color: var(--sub); margin: 22px 0 8px; }
  input, select, textarea { width: 100%; min-height: 58px; padding: 0 16px; font-size: 19px; border: 2px solid var(--linie); border-radius: 14px; background: var(--card); }
  textarea { padding: 12px 16px; min-height: 96px; resize: vertical; }
  input:disabled, select:disabled, textarea:disabled { opacity: .7; }
  input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 3px solid var(--gelb-band); outline-offset: 2px; }
  .karte { background: var(--card); border: 1px solid var(--linie); border-radius: 18px; padding: 16px; }
  .liste { background: var(--card); border: 1px solid var(--linie); border-radius: 18px; padding: 0 16px; margin-top: 12px; }
  .zeile { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 66px; padding: 10px 0; border: 0; border-bottom: 1px solid var(--linie); background: transparent; text-align: left; color: inherit; text-decoration: none; }
  .liste > .zeile:last-child { border-bottom: 0; }
  .zeile .t { flex: 1; min-width: 0; }
  .zeile .t b { display: block; }
  .gitter { display: grid; gap: 12px; }
  .zwei { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .kachel { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 98px; padding: 16px; border-radius: 20px; border: 1px solid var(--linie); background: var(--card); text-align: left; }
  .kachel .ic { flex: none; width: 56px; height: 56px; border-radius: 16px; background: var(--grau); display: flex; align-items: center; justify-content: center; }
  .kachel .t { flex: 1; min-width: 0; }
  .kachel .t b { display: block; font-size: 22px; }
  .kachel .t span { color: var(--sub); font-size: 17px; }
  .kachel.k { min-height: 66px; padding: 10px 14px; border-radius: 16px; gap: 12px; }
  .kachel.k .ic { width: 42px; height: 42px; border-radius: 12px; }
  .kachel.k .t b { font-size: 19px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 64px; padding: 0 16px; border-radius: 16px; font-size: 21px; font-weight: 700; border: 0; text-align: center; }
  .btn.haupt { background: var(--rot); color: #fff; }
  .btn.gruen { background: var(--gruen-btn); color: #fff; }
  .btn.zweit { background: var(--card); border: 2px solid var(--linie); }
  .btn.gross { min-height: 84px; font-size: 24px; }
  .btn:disabled { opacity: .55; }
  .knopf { flex: none; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--linie); background: var(--card); font-size: 17px; font-weight: 700; }
  .link { min-height: 48px; border: 0; background: transparent; font-size: 17px; font-weight: 700; padding: 0 6px; text-decoration: underline; }
  .leise { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; margin: 24px auto 0; padding: 0 18px; border: 0; border-radius: 12px; background: transparent; font-size: 18px; font-weight: 700; text-decoration: underline; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { min-height: 52px; padding: 0 18px; border-radius: 999px; font-size: 18px; font-weight: 700; border: 2px solid var(--linie); background: var(--card); }
  .chip.an { background: var(--text); border-color: var(--text); color: var(--bg); }
  .pill { display: inline-block; font-size: 16px; font-weight: 700; padding: 3px 12px; border-radius: 999px; white-space: nowrap; background: var(--grau); }
  .pill.gruen, .box.gruen { background: var(--gruen-bg); color: var(--gruen); }
  .pill.gelb, .box.gelb { background: var(--gelb-bg); color: var(--gelb); }
  .pill.rot, .box.rot { background: var(--aus-bg); color: var(--aus); }
  .box { border-radius: 18px; padding: 16px; }
  .box .gross { font-size: 24px; font-weight: 700; }
  .fz { display: flex; align-items: center; gap: 12px; width: 100%; padding: 0; border-radius: 20px; border: 1px solid var(--linie); background: var(--card); text-align: left; overflow: hidden; }
  .fz .band { flex: none; width: 10px; align-self: stretch; }
  .fz .t { flex: 1; min-width: 0; padding: 16px 0 16px 4px; }
  .fz .t b { font-size: 26px; margin-right: 8px; }
  .fz .t .info { display: block; color: var(--sub); font-size: 17px; margin-top: 4px; }
  .fz .pf { padding-right: 14px; display: flex; }
  .band.gruen { background: var(--gruen-btn); } .band.gelb { background: var(--gelb-band); } .band.rot { background: var(--aus); }
  .laeuft { background: var(--gelb-bg); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
  .punkt { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--gelb-band); margin-right: 8px; }
  .dabox { display: flex; align-items: center; gap: 12px; background: var(--gruen-bg); color: var(--gruen); border-radius: 18px; padding: 14px 16px; margin-bottom: 16px; font-weight: 700; }
  .dabox span { display: block; color: var(--text); font-weight: 400; font-size: 17px; }
  .haken { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto; background: var(--gruen-bg); color: var(--gruen); display: flex; align-items: center; justify-content: center; }
  .namen { display: flex; gap: 8px; flex-wrap: wrap; }
  .namen span { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--grau); font-size: 17px; }
  .warn { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--aus-bg); color: var(--aus); font-weight: 700; font-size: 17px; white-space: pre-line; }
  .hinweis { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--grau); font-size: 17px; }
  .typ { flex: none; width: 56px; text-align: center; font-size: 15px; font-weight: 700; padding: 6px 0; border-radius: 8px; background: var(--grau); }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 14px; border-radius: 12px; font-size: 18px; font-weight: 700; text-align: left; border: 2px solid var(--linie); background: var(--card); }
  .opt i { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; }
  .opt.an.gruen { border-color: var(--gruen); background: var(--gruen-bg); color: var(--gruen); }
  .opt.an.gelb { border-color: var(--gelb); background: var(--gelb-bg); color: var(--gelb); }
  .opt.an.rot { border-color: var(--aus); background: var(--aus-bg); color: var(--aus); }
  .opt.an i { background: currentColor; }
  .wahl2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .wahl2 button { min-height: 54px; border-radius: 12px; font-size: 18px; font-weight: 700; border: 2px solid var(--linie); background: var(--card); }
  .wahl2 button.ok { border-color: var(--gruen); background: var(--gruen-bg); color: var(--gruen); }
  .wahl2 button.m { border-color: var(--aus); background: var(--aus-bg); color: var(--aus); }
  .kpi { padding: 14px; border-radius: 16px; font-weight: 700; border: 0; text-align: left; font-size: 18px; }
  .kpi b { display: block; font-size: 32px; }
  .sticky { position: sticky; bottom: 12px; margin-top: 18px; }
  .lade { padding: 60px 0; text-align: center; color: var(--sub); }
  .fuss { text-align: center; color: var(--sub); font-size: 15px; margin-top: 32px; }
  .hg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .blatt { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; background: var(--card); border-radius: 24px 24px 0 0; padding: 24px 18px 28px; }
  .blatt h2 { margin: 0; font-size: 25px; }
  .blatt p { margin: 8px 0 16px; color: var(--sub); font-size: 18px; white-space: pre-line; }
  .blatt .btn { margin-top: 10px; }
  #toast { position: fixed; left: 16px; right: 16px; top: 16px; max-width: 528px; margin: 0 auto; padding: 16px; border-radius: 16px; background: var(--text); color: var(--bg); font-weight: 700; font-size: 18px; text-align: center; z-index: 20; white-space: pre-line; }
  #toast.fehler { background: var(--aus); color: #fff; }
  @media (prefers-color-scheme: dark) { #toast.fehler { background: #991B1B; } }
  [hidden] { display: none !important; }
</style>
</head>
<body data-start="<?= start ?>" data-fz="<?= fz ?>">
<div id="app"><div class="lade">wird geladen …</div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
(() => {
  // ---------- Werkzeuge ----------
  const $app = document.getElementById('app');
  const h = (tag, a, ...kids) => {
    const e = document.createElement(tag);
    if (a) Object.keys(a).forEach((k) => {
      const v = a[k];
      if (v == null || v === false) return;
      if (k === 'class') e.className = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (k === 'value') e.value = v;
      else e.setAttribute(k, v === true ? '' : v);
    });
    kids.flat(9).forEach((k) => { if (k == null || k === false) return; e.appendChild(typeof k === 'object' ? k : document.createTextNode(String(k))); });
    return e;
  };
  const IC = {
    rechts: '<path d="M9 6l6 6-6 6"/>', links: '<path d="M15 6l-6 6 6 6"/>', haken: '<path d="M5 12l5 5 9-10"/>',
    da: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7 1.7 0 3.2.6 4.4 1.5"/><path d="M15 18l2.5 2.5L22 16"/>',
    auto: '<path d="M2 16V7a1 1 0 0 1 1-1h11v10"/><path d="M14 9h4l4 4v3h-2"/><path d="M2 16h2"/><path d="M10 16h6"/><circle cx="7" cy="17" r="2.2"/><circle cx="18" cy="17" r="2.2"/>',
    doku: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/>',
    schild: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    werkzeug: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
    liste: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 13l2 2 4-4"/>',
    warn: '<path d="M12 3l10 18H2z"/><path d="M12 10v5"/><path d="M12 18h.01"/>',
    kamera: '<path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/>',
    stift: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
    schloss: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    alarm: '<path d="M6 18V11a6 6 0 0 1 12 0v7"/><path d="M4 18h16"/><path d="M10 21h4"/><path d="M12 2v2"/><path d="M3.5 6.5l1.5 1"/><path d="M20.5 6.5l-1.5 1"/>',
    uhr: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
  };
  // Kinder anhängen: Listen werden aufgelöst, leere Werte übersprungen
  const add = (el, ...kids) => { kids.flat(9).forEach((k) => { if (k == null || k === false) return; el.appendChild(typeof k === 'object' ? k : document.createTextNode(String(k))); }); return el; };
  const icon = (n, gr) => { const s = h('span', { 'aria-hidden': 'true', style: 'display:flex' }); s.innerHTML = '<svg width="' + (gr || 24) + '" height="' + (gr || 24) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + IC[n] + '</svg>'; return s; };
  const run = (fn, ...args) => new Promise((ok, nein) => {
    if (!(window.google && google.script && google.script.run)) { nein(new Error('Nur in der Web-App verfügbar.')); return; }
    google.script.run.withSuccessHandler(ok).withFailureHandler(nein)[fn](...args);
  });
  const lies = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const schreib = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* privat */ } };
  const pad = (n) => String(n).padStart(2, '0');
  const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const uhr = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const tagName = (t) => {
    const d = new Date(t), a = new Date(); a.setHours(0, 0, 0, 0);
    const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - a) / 864e5);
    return diff === 0 ? 'heute' : diff === 1 ? 'morgen' : diff === -1 ? 'gestern' : WT[d.getDay()] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.';
  };
  const wann = (t) => tagName(t) + ' ' + uhr(t);
  const spanne = (v, b) => tagName(v) + ' · ' + uhr(v) + ' – ' + (tagName(b) === tagName(v) ? uhr(b) : wann(b));
  const dauer = (ms) => { const m = Math.max(1, Math.round(ms / 60000)); return m === 1 ? '1 Minute' : m < 60 ? m + ' Minuten' : Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min'; };
  const isoTag = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const isoLokal = (t) => isoTag(new Date(t)) + 'T' + uhr(t);
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
  const kuerzel = (n) => String(n).split(' ').filter(Boolean).map((x) => x[0]).join('').slice(0, 2).toUpperCase();
  const vorname = (n) => String(n).split(' ')[0];

  let toastT = null;
  const melde = (t, istFehler) => {
    const el = document.getElementById('toast'); el.textContent = t; el.className = istFehler ? 'fehler' : ''; el.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, istFehler ? 7000 : 5000);
  };
  const fehler = (e) => melde((e && e.message) || String(e), true);

  // Rückfrage als Blatt von unten: { titel, text, ja, nein, gruen, felder: (box) => {}, aktion: async () => {} } – aktion gibt false zurück = offen lassen
  const frage = (f) => {
    const hg = h('div', { class: 'hg', onclick: (e) => { if (e.target === hg) hg.remove(); } });
    const ja = h('button', { type: 'button', class: 'btn ' + (f.gruen ? 'gruen' : 'haupt') }, f.ja || 'Ja');
    const extra = h('div');
    const box = h('div', { class: 'blatt', role: 'dialog', 'aria-modal': 'true' }, h('h2', null, f.titel), f.text ? h('p', null, f.text) : null, extra, ja,
      h('button', { type: 'button', class: 'btn zweit', onclick: () => hg.remove() }, f.nein || 'Abbrechen'));
    if (f.felder) f.felder(extra);
    ja.onclick = async () => {
      ja.disabled = true; ja.textContent = '…';
      try { const weiter = await f.aktion(); if (weiter !== false) hg.remove(); else { ja.disabled = false; ja.textContent = f.ja || 'Ja'; } }
      catch (e) { ja.disabled = false; ja.textContent = f.ja || 'Ja'; fehler(e); }
    };
    hg.appendChild(box); document.body.appendChild(hg);
    const erstes = box.querySelector('input, textarea, select'); if (erstes) erstes.focus(); else ja.focus();
  };
  // Server-Antwort { ok, text | fehler } → Meldung; wirft bei Fehler
  const antwort = (r) => { if (!r || !r.ok) { setTimeout(() => { if (typeof laden === 'function') laden(); }, 0); throw new Error((r && r.fehler) || 'Hat nicht geklappt.'); } if (r.text) melde(r.text); return r; };

  // ---------- Zustand ----------
  let ich = lies('ff-ich');
  let verw = lies('ff-verw');
  if (verw && (!verw.bis || verw.bis < Date.now() || norm(verw.fuer) !== norm(ich))) { verw = null; schreib('ff-verw', null); }
  let daten = null, zahlen = null, doks = null, anwDaten = null;
  const stapel = [];
  let seite = { s: 'start' }, ziel = null;   // ziel: gewünschte Seite (QR-Code), bevor der Name gewählt ist

  const zeige = (neu) => {
    stapel.push(seite); seite = neu; zeichne(true);
    try { if (window.google && google.script && google.script.history) google.script.history.push({ n: stapel.length }); } catch (e) { /* egal */ }
  };
  const zurueck = () => { seite = stapel.pop() || { s: 'start' }; zeichne(true); };
  const heim = () => { stapel.length = 0; seite = { s: 'start' }; zeichne(true); };
  try { if (window.google && google.script && google.script.history) google.script.history.setChangeHandler(() => { if (stapel.length) zurueck(); }); } catch (e) { /* egal */ }

  const laden = async () => {
    try { daten = await run('appDaten', ich || ''); }
    catch (e) {
      if (!daten) { $app.textContent = ''; $app.appendChild(h('div', { class: 'lade' }, 'Konnte nicht laden: ' + e.message, h('button', { type: 'button', class: 'btn zweit', style: 'margin-top:20px', onclick: () => { $app.textContent = 'wird geladen …'; laden(); } }, 'Nochmal versuchen'))); }
      else fehler(e);
      return;
    }
    if (ich && daten.mitglieder.length && !daten.mitglieder.some((n) => norm(n) === norm(ich))) { ich = null; schreib('ff-ich', null); verw = null; schreib('ff-verw', null); }
    zeichne(false);
  };
  const zahlenLaden = async () => {
    if (!verw) { zahlen = null; return; }
    try {
      const r = await run('verwaltungZahlen', verw.pin);
      if (!r.ok) { verw = null; zahlen = null; schreib('ff-verw', null); melde('Verwaltung: bitte neu anmelden.'); }
      else { zahlen = r; if (r.rolle !== verw.rolle || (r.funktion != null && r.funktion !== verw.funktion)) { verw.rolle = r.rolle; if (r.funktion != null) verw.funktion = r.funktion; schreib('ff-verw', verw); } }
    } catch (e) { /* Zahlen sind nur Komfort */ }
    if (seite.s === 'start') zeichne(false);
  };

  // ---------- Bausteine ----------
  const kopfZurueck = (text) => h('div', { class: 'bar' }, h('button', { type: 'button', class: 'zurueck', onclick: zurueck }, icon('links'), text || 'Zurück'));
  const fzById = (id) => daten.fahrzeuge.find((f) => f.id === id);
  const meineFahrt = () => { if (!daten || !ich) return null; for (const f of daten.fahrzeuge) { const u = f.unterwegs; if (u && u.laeuft && norm(u.name) === norm(ich)) return { fz: f.id, b: u }; } return null; };
  // Status eines Fahrzeugs für die Anzeige
  const lage = (f) => {

        liste.length ? h('div', { class: 'gitter', style: 'gap:10px' }, liste.map((p) => h('div', { class: 'karte' },
          h('b', { style: 'display:block;font-size:20px' }, p.name), p.mitglied ? null : h('div', { class: 'sub klein' }, 'nicht im Tab „Mitglieder“ gefunden'),
          p.fristen.filter((x) => filter === 'alle' || x.ampel === 'rot' || x.ampel === 'gelb').map((x) => h('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px' },
            h('span', { style: 'flex:1;min-width:150px;font-size:18px' }, x.art), h('span', { class: 'sub' }, x.bis ? 'bis ' + tagDatum(x.bis) : ''), h('span', { class: 'pill ' + (x.ampel === 'grau' ? '' : x.ampel) }, FR_TXT[x.ampel])))))) :
          h('p', { class: 'sub' }, 'Nichts fällig – alle Fristen sind länger als 60 Tage gültig.'),
        r.nurAts ? null : h('div', { class: 'karte', style: 'margin-top:20px' },
          h('b', { style: 'display:block;font-size:19px' }, 'Abgleich mit dem FDISK'),
          h('p', { class: 'sub', style: 'margin:6px 0 0' }, r.fdiskStand ? 'Zuletzt abgeglichen: ' + tagDatum(r.fdiskStand) + ' · ' + uhr(r.fdiskStand) + ' Uhr' : 'Noch nie abgeglichen.'),
          r.abgleichStatus ? h('div', { class: 'warn' }, r.abgleichStatus.text + ' (' + wann(r.abgleichStatus.am) + ')') : null,
          r.anfrage ? h('p', { class: 'sub', style: 'margin:8px 0 0' }, 'Angefordert ' + wann(r.anfrage.am) + ' von ' + r.anfrage.von + '. Läuft am Abend ab 19:20 – FDISK muss im eingebauten Browser der Claude-App angemeldet sein.') : null,
          rollen().anw ? h('button', { type: 'button', class: 'btn zweit', style: 'margin-top:12px', onclick: (e) => { const b = e.currentTarget; frage({ titel: 'Mit FDISK abgleichen?', text: 'Führerscheine und andere Fristen werden heute Abend aus dem FDISK geholt. Dafür muss FDISK im eingebauten Browser der Claude-App angemeldet sein.', ja: 'Ja, anfordern', aktion: async () => { antwort(await run('fristenAnfordern', verw.pin)); zeichne(false); } }); } }, r.anfrage ? 'Nochmal anfordern' : 'Mit FDISK abgleichen') : null),
        h('p', { class: 'sub klein', style: 'margin-top:20px' }, 'Atemschutz aus der ATS-Tabelle im Drive' + (r.nurAts ? '' : r.fdiskStand ? ', übrige Fristen aus dem FDISK (Stand ' + tagDatum(r.fdiskStand) + ')' : '; FDISK-Fristen sind noch nicht abgeglichen') + '. Gelb = in den nächsten 60 Tagen. 30 Tage vorher geht eine Erinnerung per Mail.'));
    }).catch((e) => { box.textContent = ''; box.appendChild(h('div', { class: 'warn' }, e.message)); });
    return [kopfZurueck('Start'), h('h1', null, rollen().anw ? 'Fristen' : 'Atemschutz-Fristen'), box];
  };

  // ---------- Zeichnen ----------
  const ADMIN = { maengel: 1, fzstatus: 1, geraete: 1, gliste: 1, gform: 1, anwp: 1, anwt: 1, taet: 1, taetneu: 1, einsl: 1, eins: 1, fristen: 1 };
  function zeichne(nachOben) {
    if (!daten) return;
    if (!ich) { if (seite.s !== 'wer' && seite.s !== 'start') ziel = seite; seite = { s: 'wer' }; stapel.length = 0; }
    else if (ADMIN[seite.s] && !verw) seite = { s: 'pin' };
    else if ((seite.s === 'fzstatus' || seite.s === 'taet' || seite.s === 'taetneu') && !rollen().fz) seite = { s: 'start' };
    else if ((seite.s === 'anwp' || seite.s === 'anwt' || seite.s === 'einsl' || seite.s === 'eins') && !rollen().anw) seite = { s: 'start' };
    else if (seite.s === 'fristen' && !rollen().ats) seite = { s: 'start' };
    // Verwaltungsseiten laden ihre Daten selbst – beim automatischen Aktualisieren nicht neu zeichnen
    if (!nachOben && ADMIN[seite.s] && $app.dataset.seite === seite.s && !{ anwt: 1, taet: 1, taetneu: 1, eins: 1, fristen: 1 }[seite.s]) return;
    const y = window.scrollY, aktiv = document.activeElement && document.activeElement.id;
    $app.textContent = '';
    $app.dataset.seite = seite.s;
    $app.append(...[].concat(SEITEN[seite.s]()).flat(9).filter(Boolean));
    if (ich && seite.s !== 'wer') $app.appendChild(h('div', { class: 'fuss' }, 'Angemeldet als ' + ich));
    if (nachOben) window.scrollTo(0, 0);
    else { window.scrollTo(0, y); if (aktiv) { const el = document.getElementById(aktiv); if (el) el.focus(); } }
  }

  // ---------- Start ----------
  const startArt = document.body.dataset.start || '', startFz = document.body.dataset.fz || '';
  if (startFz) seite = { s: 'fahrzeug', id: startFz };
  else if (startArt === 'da') seite = { s: 'da' };
  else if (startArt === 'einsatz') seite = { s: 'einsatz' };
  else if (startArt === 'fahrzeuge') seite = { s: 'fahrzeuge' };
  else if (startArt === 'mangel') seite = { s: 'mangel' };
  else if (startArt === 'maengel') seite = verw ? { s: 'maengel' } : { s: 'pin' };
  else if (startArt === 'einsaetze' || startArt === 'fristen') seite = verw ? { s: startArt === 'einsaetze' ? 'einsl' : 'fristen' } : { s: 'pin' };
  else if (startArt === 'verwaltung') seite = verw ? { s: 'start' } : { s: 'pin' };
  if (seite.s !== 'start') stapel.push({ s: 'start' });
  if (seite.s === 'fahrzeug') stapel.push({ s: 'fahrzeuge' });
  laden().then(zahlenLaden);
  // Automatisch aktualisieren, solange keine Rückfrage offen ist und nichts eingetippt wird
  const ANZEIGE = { start: 1, fahrzeuge: 1, fahrzeug: 1, laeuft: 1 };
  const auffrischen = () => { if (ANZEIGE[seite.s] && !document.querySelector('.hg') && document.visibilityState === 'visible') laden(); };
  setInterval(auffrischen, 120000);
  document.addEventListener('visibilitychange', auffrischen);
})();
</script>
